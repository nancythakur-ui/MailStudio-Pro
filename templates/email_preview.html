{% extends "base.html" %}{% block content %}<div class="eyebrow">Personalized rendering</div><h1>{{campaign.name}} — Preview</h1><p class="muted">Sample recipient: {{sample.name}} ({{sample.email}}). This is a browser preview, not an inbox rendering test.</p><div class="card" style="max-width:720px;margin:18px auto;text-align:center"><p><b>Subject:</b> {{campaign.subject}}</p><iframe title="Email template preview" src="/email/{{campaign.template}}?name=Nancy" style="width:100%;height:760px;border:1px solid #e5e9f0;border-radius:8px;background:white"></iframe></div><a class="btn secondary" href="/campaigns/{{campaign.id}}/qa">Open QA checklist</a>{% endblock %}
